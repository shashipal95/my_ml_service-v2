version: '3.9'

services:
  nginx:
    restart: always
    image: nginx:stable-alpine
    ports:
      - "8000:80"  # map Nginx port 80 to host 8000
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/backend/server/static

  wsgiserver:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    entrypoint: /app/docker/backend/start-backend.sh
    volumes:
      - static_volume:/app/backend/server/static
    expose:
      - "8000"
    restart: always

volumes:
  static_volume:
